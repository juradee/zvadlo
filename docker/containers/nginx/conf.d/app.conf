resolver 127.0.0.11;

upstream php {
    server php:9000;
}

upstream php-test {
    server php-test:9000;
}

# Acceptance tests run against the test PHP container; Selenium sends this cookie.
map $cookie_SELENIUM $fastcgi_target {
    default  "php";
    SELENIUM "php-test";
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    root /app/www;
    index index.php;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass $fastcgi_target:9000;
        fastcgi_read_timeout 120s;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\. {
        deny all;
    }
}
