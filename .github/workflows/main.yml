name: main

on:
  push:
    branches:
      - master
      - 'beta/**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The CI images copy the checkout into the image (docker/docker-compose.ci.yml), so vendor/ and www/assets/
# are produced on the runner first and every make target then runs inside the containers.
jobs:
  checks:
    name: Checks on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    env:
      COMPOSE_FILE: docker/docker-compose.yml:docker/docker-compose.ci.yml
      PHP: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: soap, intl, pdo_mysql, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Dependency audit
        run: composer audit --no-interaction

      - name: Build images
        run: make build

      - name: Coding standard
        run: make check-cs-check

      - name: PHPStan
        run: make check-phpstan

      - name: Latte lint
        run: make check-latte

      - name: Unit tests
        run: make test-unit

      - name: Integration tests
        run: make test-integration

      - name: Mapping validation
        run: make test-mapping

      - name: Clean up
        if: always()
        run: make down

  acceptance:
    name: Acceptance tests
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker/docker-compose.yml:docker/docker-compose.ci.yml
      PHP: '8.4'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: soap, intl, pdo_mysql, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Build assets
        run: npm ci && npm run check-types && npm run build

      - name: Build images
        run: docker compose build php-test nginx

      - name: Acceptance tests
        run: make ci-acceptance

      - name: Codeception output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: codeception-output
          path: tests/_output
          if-no-files-found: ignore

      - name: Clean up
        if: always()
        run: make down

  # ── Release build (only for branches that deploy) ─────────────────────────
  build:
    name: Build release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: soap, intl, pdo_mysql, zip
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --classmap-authoritative

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Build assets
        run: npm ci && npm run build

      - name: Pack release
        run: |
          tar --exclude-vcs --exclude='./node_modules' --exclude='./tests' --exclude='./docker' --exclude='./.docs' --exclude='./.agents' \
              --exclude='./log' --exclude='./temp' --exclude='./uploads' --exclude='./frontend' \
              -czf /tmp/release.tar.gz -C . .
          mv /tmp/release.tar.gz release.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ── Deploys: GitHub environments hold the variables and secrets ───────────
  # Beta and test servers deploy only when the repository variable DEPLOY_BETA or DEPLOY_TEST is 'true'
  # (bin/github-setup.sh sets it); production deploys after deploy-test, or straight after the build
  # while deploy-test is switched off.
  deploy-beta:
    name: Deploy beta
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/beta/') && vars.DEPLOY_BETA == 'true'
    needs: [checks, acceptance, build]
    runs-on: ubuntu-latest
    environment:
      name: beta
      url: ${{ vars.APP_BASE_URL }}
    concurrency:
      group: deploy-beta
      cancel-in-progress: false
    steps: &deploy-steps
      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Unpack release
        run: tar -xzf release.tar.gz && rm release.tar.gz

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Deployer
        run: |
          curl -fsSL https://github.com/deployphp/deployer/releases/download/v7.5.12/deployer.phar -o /usr/local/bin/dep
          chmod +x /usr/local/bin/dep

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust SSH endpoints
        env:
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PREPARE_PORT: ${{ vars.DEPLOY_PREPARE_PORT }}
          DEPLOY_PREPARE_KNOWN_HOSTS: ${{ vars.DEPLOY_PREPARE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          if [ -n "$DEPLOY_PREPARE_PORT" ]; then
            if [ -z "$DEPLOY_PREPARE_KNOWN_HOSTS" ]; then
              echo 'DEPLOY_PREPARE_KNOWN_HOSTS must be set when DEPLOY_PREPARE_PORT is set.' >&2
              exit 1
            fi
            printf '%s\n' "$DEPLOY_PREPARE_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          fi

      - name: Prepare SSH connection
        if: vars.DEPLOY_PREPARE_PORT != ''
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PREPARE_PORT: ${{ vars.DEPLOY_PREPARE_PORT }}
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PREPARE_PORT" -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" true || \
            echo 'The preparation SSH session ended as expected.'

          for attempt in {1..30}; do
            if ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" true; then
              exit 0
            fi
            echo "Waiting for deploy SSH on port $DEPLOY_PORT... ($attempt/30)"
            sleep 2
          done

          echo "Deploy SSH on port $DEPLOY_PORT did not become available." >&2
          exit 1

      - name: Deploy
        run: dep deploy ${{ env.DEPLOY_TARGET }} -f deploy.php --no-interaction -v
        env:
          DEPLOY_TARGET: ${{ github.job }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PREPARE_PORT: ${{ vars.DEPLOY_PREPARE_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_PHP_BIN: ${{ vars.DEPLOY_PHP_BIN }}
          DEPLOY_WEB_ROOT: ${{ vars.DEPLOY_WEB_ROOT }}
          APP_ENV: ${{ vars.APP_ENV }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          APPLICATION_ID: ${{ vars.APPLICATION_ID }}
          SKAUTIS_TEST_MODE: ${{ vars.SKAUTIS_TEST_MODE }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ vars.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SEND_EMAIL: ${{ vars.SEND_EMAIL }}
          SYSTEM_EMAIL: ${{ vars.SYSTEM_EMAIL }}
          ERROR_EMAILS: ${{ vars.ERROR_EMAILS }}
          TEST_BACKGROUND: ${{ vars.TEST_BACKGROUND }}
          ENVIRONMENT_LABEL: ${{ vars.ENVIRONMENT_LABEL }}
          ENVIRONMENT_COLOR: ${{ vars.ENVIRONMENT_COLOR }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_REDIRECT_URI: ${{ vars.GOOGLE_REDIRECT_URI }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GITHUB_ISSUES_TOKEN: ${{ secrets.GH_ISSUES_TOKEN }}
          HSKAUTING_WEBHOOK_URL: ${{ vars.HSKAUTING_WEBHOOK_URL }}
          HSKAUTING_WEBHOOK_SECRET: ${{ secrets.HSKAUTING_WEBHOOK_SECRET }}
          ADMIN_USER_IDS: ${{ vars.ADMIN_USER_IDS }}
          RETENTION_MONTHS_SYNCED: ${{ vars.RETENTION_MONTHS_SYNCED }}
          RETENTION_MONTHS_UNSYNCED: ${{ vars.RETENTION_MONTHS_UNSYNCED }}
          MAINTENANCE_MODE: ${{ vars.MAINTENANCE_MODE }}
          MAINTENANCE_ALLOWED_IPS: ${{ vars.MAINTENANCE_ALLOWED_IPS }}
          MAINTENANCE_STARTED_AT: ${{ vars.MAINTENANCE_STARTED_AT }}
          MAINTENANCE_ENDS_AT: ${{ vars.MAINTENANCE_ENDS_AT }}
          GITHUB_SHA: ${{ github.sha }}

  deploy-test:
    name: Deploy test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.DEPLOY_TEST == 'true'
    needs: [checks, acceptance, build]
    runs-on: ubuntu-latest
    environment:
      name: test
      url: ${{ vars.APP_BASE_URL }}
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    steps: *deploy-steps

  deploy-production:
    name: Deploy production
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master'
      && needs.checks.result == 'success' && needs.acceptance.result == 'success' && needs.build.result == 'success'
      && (needs.deploy-test.result == 'success' || needs.deploy-test.result == 'skipped')
    needs: [checks, acceptance, build, deploy-test]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_BASE_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps: *deploy-steps
