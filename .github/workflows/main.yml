name: main

on:
  push:
    branches:
      - master
      - 'beta/**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The CI images copy the checkout into the image (docker/docker-compose.ci.yml), so vendor/ and www/assets/
# are produced on the runner first and every make target then runs inside the containers.
jobs:
  checks:
    name: Checks on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    env:
      COMPOSE_FILE: docker/docker-compose.yml:docker/docker-compose.ci.yml
      PHP: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: soap, intl, pdo_mysql, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Build images
        run: make build

      - name: Coding standard
        run: make check-cs-check

      - name: PHPStan
        run: make check-phpstan

      - name: Latte lint
        run: make check-latte

      - name: Package tests
        run: make test-packages

      - name: Unit tests
        run: make test-unit

      - name: Integration tests
        run: make test-integration

      - name: Mapping validation
        run: make test-mapping

      - name: Clean up
        if: always()
        run: make down

  acceptance:
    name: Acceptance tests
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker/docker-compose.yml:docker/docker-compose.ci.yml
      PHP: '8.4'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: soap, intl, pdo_mysql, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Build assets
        run: npm ci && npm run build

      - name: Build images
        run: make build

      - name: Acceptance tests
        run: make ci-acceptance

      - name: Codeception output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: codeception-output
          path: tests/_output
          if-no-files-found: ignore

      - name: Clean up
        if: always()
        run: make down
